<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TankScript | Create Account</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="site-brand"><a href="index.html"><strong>TankScript</strong></a></div>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="tank-editor.html">Tank Editor</a></li>
          <li><a href="battle.html">Battle</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="register-page">
      <section class="register-panel" aria-labelledby="register-heading">
        <p class="register-label">NEW PLAYER SETUP</p>
        <h1 id="register-heading">Create your TankScript account</h1>
        <p class="register-intro">Set up your account and start building strategies for the arena.</p>

        <form action="#" method="post">
          <div class="register-field">
            <label for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username" autocomplete="username" required />
          </div>
          <div class="register-field">
            <label for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="register-field">
            <label for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required />
          </div>
          <div class="register-field">
            <label for="confirm-password">Confirm Password</label>
            <input class="form-control" type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
          </div>
          <button class="btn btn-primary register-submit" type="submit">Create Account</button>
        </form>

        <p class="register-login">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-credit">
          <img src="hs-logo.png" alt="HS logo" />
          <p>TankScript created by Hadden Smith.</p>
        </div>
        <a class="footer-repository" href="https://github.com/HaddenSmith/TankScript">TankScript GitHub repository</a>
      </div>
    </footer>
  </body>
</html>
